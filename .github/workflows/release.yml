name: Build installers
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win nsis portable --x64 --publish never
      - name: Build Mac
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac dmg --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux AppImage --publish never
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: NMS Companion v1.0.${{ github.run_number }}
          body: "Free desktop companion for No Man's Sky. Unsigned build: Windows may say unknown publisher (More info, Run anyway); macOS needs right-click, Open."
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
